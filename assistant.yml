    - data:
        code: "import json\n\ndef main(arg1):\n    # 防御层：兼容列表/字典/JSON字符串输入\n    if\
          \ isinstance(arg1, list):\n        arg1 = arg1[0] if len(arg1) > 0 else\
          \ {}\n    \n    if isinstance(arg1, str):\n        try:\n            data\
          \ = json.loads(arg1)\n        except:\n            return {\n          \
          \      \"venue_recommendation\": f\"获取场馆数据失败：{arg1}\",\n               \
          \ \"dest_location\": \"\",\n                \"dest_name\": \"\"\n      \
          \      }\n    elif isinstance(arg1, dict):\n        data = arg1\n    else:\n\
          \        return {\n            \"venue_recommendation\": \"数据格式不支持，无法解析场馆信息。\"\
          ,\n            \"dest_location\": \"\",\n            \"dest_name\": \"\"\
          \n        }\n\n    # 校验接口状态\n    if str(data.get('status', '0')) != '1':\n\
          \        return {\n            \"venue_recommendation\": f\"查询失败，高德提示：{data.get('info',\
          \ '未知错误')}\",\n            \"dest_location\": \"\",\n            \"dest_name\"\
          : \"\"\n        }\n\n    pois = data.get('pois', [])\n    if not pois:\n\
          \        return {\n            \"venue_recommendation\": \"抱歉，当前区域暂未搜索到合适的运动场馆。\"\
          ,\n            \"dest_location\": \"\",\n            \"dest_name\": \"\"\
          \n        }\n\n    # 格式化场馆列表文本\n    result_text = \"\U0001F3CB️ 为您推荐附近优质运动场地：\\\
          n\"\n    for i, p in enumerate(pois[:3]):\n        name = p.get('name',\
          \ '未知场馆')\n        address = p.get('address', '未知地址')\n        distance\
          \ = p.get('distance', '')\n        dist_str = f\"（距离约{distance}米）\" if distance\
          \ else \"\"\n        result_text += f\"\\n{i+1}. {name}{dist_str}\\n   地址：{address}\\\
          n\"\n\n    # 提取第一个场馆的经纬度和名称（作为路径规划终点）\n    first_poi = pois[0]\n    dest_location\
          \ = first_poi.get('location', '')  # 格式：经度,纬度\n    dest_name = first_poi.get('name',\
          \ '未知场馆')\n\n    return {\n        \"venue_recommendation\": result_text,\n\
          \        \"dest_location\": dest_location,\n        \"dest_name\": dest_name\n\
          \    }"
