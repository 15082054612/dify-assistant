          , \"支链氨基酸\", \"鱼油\",\n            \"受伤\", \"拉伤\", \"扭伤\", \"抽筋\", \"中暑\"\
          , \"低血糖\", \"肌肉酸痛\",\n            \"膝盖疼\", \"崴脚\", \"损伤\", \"急救\", \"处理方法\"\
          ,\n            \"训练方法\", \"怎么练\", \"减脂\", \"增肌\", \"塑形\", \"热身\", \"拉伸\"\
          ,\n            \"恢复\", \"饮食\", \"营养\", \"运动计划\", \"训练计划\", \"动作规范\"\n  \
          \      ],\n        # 场地/路线意图\n        \"venue\": [\n            \"健身房\"\
          , \"游泳馆\", \"公园\", \"跑道\", \"运动场地\", \"哪里运动\", \"附近\",\n            \"打球的地方\"\
          , \"跑步地点\", \"健身地点\", \"场馆\", \"球场\", \"羽毛球馆\",\n            \"篮球场\", \"\
          足球场\", \"在哪运动\", \"推荐场地\", \"运动的地方\",\n            \"怎么去\", \"路线\", \"导航\"\
          , \"过去多久\", \"驾车路线\", \"怎么过去\"\n        ]\n    }\n\n    # 统计各意图关键词命中次数\n\
          \    hit_count = {}\n    for intent, keywords in intent_keywords.items():\n\
          \        count = 0\n        for kw in keywords:\n            if kw in user_query:\n\
          \                count += 1\n        hit_count[intent] = count\n\n    max_count\
          \ = max(hit_count.values())\n    # 无任何命中 → 通用兜底\n    if max_count == 0:\n\
          \        return {\n            \"intent\": \"general\",\n            \"\
          intent_name\": \"通用咨询\",\n            \"confidence\": 0.0\n        }\n\n\
          \    # 多意图命中时的优先级：场地 > 天气 > 知识\n    priority = [\"venue\", \"weather\",\
          \ \"knowledge\"]\n    final_intent = None\n    for intent in priority:\n\
          \        if hit_count[intent] == max_count:\n            final_intent =\
          \ intent\n            break\n\n    intent_name_map = {\n        \"weather\"\
          : \"天气查询\",\n        \"knowledge\": \"运动知识咨询\",\n        \"venue\": \"运动场地/路线查询\"\
          ,\n        \"general\": \"通用咨询\"\n    }\n\n    confidence = min(max_count\
          \ / 3, 1.0)\n\n    return {\n        \"intent\": final_intent,\n       \
          \ \"intent_name\": intent_name_map[final_intent],\n        \"confidence\"\
          : confidence\n    }\n"
