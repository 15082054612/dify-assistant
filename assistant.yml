    - data:
        code: "def main(user_query: str) -> dict:\n    # ===== 防御层：异常输入处理 =====\n\
          \    if not isinstance(user_query, str):\n        user_query = str(user_query)\
          \ if user_query else \"\"\n    user_query = user_query.strip().lower()\n\
          \n    # ===== 第一层：口语别名 → 标准运动类型 映射表 =====\n    # 所有口语化、俚语、简称都在这里扩展，自动映射到标准运动分类\n\
          \    alias_map = {\n        # 健身类口语\n        \"撸铁\": \"健身\", \"练肌肉\": \"\
          健身\", \"增肌\": \"健身\", \"减脂\": \"健身\",\n        \"健身房\": \"健身\", \"练力量\"\
          : \"健身\", \"力量训练\": \"健身\", \"塑型\": \"健身\",\n        \"练肩\": \"健身\", \"\
          练腿\": \"健身\", \"器械训练\": \"健身\",\n\n        # 篮球类口语\n        \"打篮球\": \"\
          篮球\", \"打球\": \"篮球\", \"打个球\": \"篮球\", \"篮球局\": \"篮球\",\n        \"半场篮球\"\
          : \"篮球\", \"投篮球\": \"篮球\", \"野球\": \"篮球\",\n\n        # 乒乓球类口语\n       \
          \ \"乒乓球\": \"乒乓球\", \"乒乓\": \"乒乓球\", \"打乒乓\": \"乒乓球\", \"打乒乓球\": \"乒乓球\"\
          ,\n        \"乒羽\": \"乒乓球\", \"乒乓球台\": \"乒乓球\",\n\n        # 羽毛球类口语\n   \
          \     \"羽毛球\": \"羽毛球\", \"打羽毛球\": \"羽毛球\", \"羽球\": \"羽毛球\", \"打羽球\": \"\
          羽毛球\",\n\n        # 游泳类口语\n        \"游泳\": \"游泳\", \"游个泳\": \"游泳\", \"游泳馆\"\
          : \"游泳\", \"泳池\": \"游泳\",\n        \"玩水\": \"游泳\", \"泡水\": \"游泳\", \"水上运动\"\
          : \"游泳\",\n\n        # 跑步类口语\n        \"跑步\": \"跑步\", \"夜跑\": \"跑步\", \"\
          晨跑\": \"跑步\", \"慢跑\": \"跑步\",\n        \"跑两步\": \"跑步\", \"田径\": \"跑步\",\
          \ \"跑道\": \"跑步\", \"有氧跑\": \"跑步\",\n\n        # 足球类口语\n        \"足球\": \"\
          足球\", \"踢球\": \"足球\", \"踢足球\": \"足球\", \"足球局\": \"足球\",\n\n        # 网球类口语\n\
          \        \"网球\": \"网球\", \"打网球\": \"网球\", \"网球局\": \"网球\",\n\n        #\
          \ 瑜伽/静态类口语\n        \"瑜伽\": \"瑜伽\", \"练瑜伽\": \"瑜伽\", \"普拉提\": \"瑜伽\", \"\
          拉伸\": \"瑜伽\",\n\n        # 台球类口语\n        \"台球\": \"台球\", \"桌球\": \"台球\"\
          , \"打台球\": \"台球\", \"打桌球\": \"台球\",\n        \"斯诺克\": \"台球\", \"黑八\": \"\
          台球\",\n\n        # 搏击类口语\n        \"搏击\": \"搏击\", \"拳击\": \"搏击\", \"散打\"\
          : \"搏击\", \"打拳\": \"搏击\",\n        \"泰拳\": \"搏击\", \"格斗\": \"搏击\",\n\n \
          \       # 骑行类口语\n        \"骑行\": \"骑行\", \"骑车\": \"骑行\", \"骑自行车\": \"骑行\"\
          , \"单车\": \"骑行\",\n        \"公路车\": \"骑行\", \"山地车\": \"骑行\",\n\n       \
          \ # 排球类口语\n        \"排球\": \"排球\", \"打排球\": \"排球\", \"气排球\": \"排球\"\n  \
          \  }\n\n    # ===== 第二层：标准运动类型 → 高德POI搜索关键词 映射 =====\n    sport_keyword_map\
          \ = {\n        \"健身\": [\"健身房\", \"健身俱乐部\", \"健身中心\"],\n        \"篮球\":\
          \ [\"篮球场\", \"篮球馆\", \"篮球公园\"],\n        \"乒乓球\": [\"乒乓球馆\", \"乒乓球场\", \"\
          乒乓球室\"],\n        \"羽毛球\": [\"羽毛球馆\", \"羽毛球场\"],\n        \"游泳\": [\"游泳馆\"\
          , \"游泳池\", \"水上运动中心\"],\n        \"跑步\": [\"公园跑道\", \"体育场\", \"田径场\", \"\
          绿道\"],\n        \"足球\": [\"足球场\", \"足球公园\", \"五人制足球场\"],\n        \"网球\"\
          : [\"网球场\", \"网球馆\"],\n        \"瑜伽\": [\"瑜伽馆\", \"普拉提工作室\"],\n        \"\
          台球\": [\"台球厅\", \"桌球室\", \"台球俱乐部\"],\n        \"搏击\": [\"搏击馆\", \"拳击馆\"\
          , \"散打馆\"],\n        \"骑行\": [\"骑行绿道\", \"湿地公园\", \"郊野公园\"],\n        \"\
          排球\": [\"排球场\", \"排球馆\"]\n    }\n\n    # ===== 匹配逻辑：先匹配口语别名，再映射到搜索关键词 =====\n\
          \    matched_types = set()  # 用集合去重，支持多运动类型同时匹配\n\n    # 遍历所有口语别名，命中则加入匹配的标准类型\n\
          \    for alias, sport_type in alias_map.items():\n        if alias in user_query:\n\
          \            matched_types.add(sport_type)\n\n    # ===== 无匹配时的兜底逻辑 =====\n\
          \    if not matched_types:\n        return {\n            \"search_keywords\"\
          : \"运动场馆,健身中心,体育场馆\",\n            \"sport_type\": \"综合运动场馆\",\n       \
          \     \"match_status\": \"default\"\n        }\n\n    # ===== 根据匹配到的标准类型，组装最终搜索关键词\
          \ =====\n    matched_keywords = []\n    for sport_type in matched_types:\n\
          \        if sport_type in sport_keyword_map:\n            matched_keywords.extend(sport_keyword_map[sport_type])\n\
          \n    # 关键词去重，拼接为逗号分隔格式（高德API要求格式）\n    unique_keywords = list(set(matched_keywords))\n\
          \    search_keywords = \",\".join(unique_keywords)\n    sport_type_text\
          \ = \"、\".join(list(matched_types))\n\n    return {\n        \"search_keywords\"\
          : search_keywords,\n        \"sport_type\": sport_type_text,\n        \"\
          match_status\": \"success\"\n    }"
        code_language: python3
