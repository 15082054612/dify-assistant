          \ {\"start_address\": default_addr, \"start_location\": default_loc, \"\
          parse_status\": \"fail\"}\n    else:\n        data = poi_data\n    \n  \
          \  # 校验接口返回状态\n    if str(data.get(\"status\", \"0\")) != \"1\":\n     \
          \   return {\"start_address\": default_addr, \"start_location\": default_loc,\
          \ \"parse_status\": \"fail\"}\n    \n    pois = data.get(\"pois\", [])\n\
          \    if not pois:\n        return {\"start_address\": default_addr, \"start_location\"\
          : default_loc, \"parse_status\": \"fail\"}\n    \n    # 取第一条匹配度最高的结果\n \
          \   best = pois[0]\n    addr = best.get(\"name\", default_addr)\n    loc\
          \ = best.get(\"location\", default_loc)\n    \n    return {\n        \"\
