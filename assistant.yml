          \ = data.get(\"start_address\", default_address).strip()\n        if not\
          \ city:\n            city = default_city\n        if not start_address:\n\
          \            start_address = city\n        return {\"city\": city, \"start_address\"\
          : start_address}\n    except:\n        # 解析失败兜底，保证链路不中断\n        return\
          \ {\n            \"city\": default_city,\n            \"start_address\"\
          : geo_text.strip() if geo_text else default_address\n        }"
