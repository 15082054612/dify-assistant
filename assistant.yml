    - data:
        code: "import json\n\ndef main(route_data, start_address=\"起点\", dest_name=\"\
          终点\", \n         start_location=\"\", dest_location=\"\", travel_mode=\"\
          car\"):\n    \n    # 双模式统一配置\n    mode_config = {\n        \"car\": {\n\
          \            \"emoji\": \"\U0001F697\",\n            \"title\": \"驾车\",\n\
          \            \"show_toll\": True,\n            \"show_traffic_light\": True,\n\
          \            \"nav_mode\": \"car\",\n            \"tip_text\": \"出发前请检查车况，全程系好安全带，遵守交通规则。\"\
          \n        },\n        \"run\": {\n            \"emoji\": \"\U0001F3C3\"\
          ,\n            \"title\": \"跑步\",\n            \"show_toll\": False,\n \
          \           \"show_traffic_light\": False,\n            \"nav_mode\": \"\
          walk\",\n            \"tip_text\": \"出发前做好5-10分钟动态热身，沿途避让行人，长距离建议携带补水。\"\
          \n        }\n    }\n    config = mode_config.get(travel_mode, mode_config[\"\
          car\"])\n    mode_name = config[\"title\"]\n\n    # 防御层1：列表格式处理\n    if\
          \ isinstance(route_data, list):\n        if len(route_data) > 0:\n     \
          \       route_data = route_data[0]\n        else:\n            return {\n\
          \                \"route_text\": f\"❌ 未获取到{mode_name}路径规划数据\",\n       \
          \         \"total_distance_km\": 0,\n                \"total_duration_min\"\
          : 0,\n                \"toll_fee\": 0,\n                \"parse_status\"\
          : \"fail\",\n                \"route_url\": \"\"\n            }\n\n    #\
          \ 防御层2：兼容JSON字符串/字典\n    if isinstance(route_data, str):\n        try:\n\
          \            data = json.loads(route_data)\n        except json.JSONDecodeError:\n\
          \            return {\n                \"route_text\": f\"❌ 路径数据解析失败：{route_data}\"\
          ,\n                \"total_distance_km\": 0,\n                \"total_duration_min\"\
          : 0,\n                \"toll_fee\": 0,\n                \"parse_status\"\
          : \"fail\",\n                \"route_url\": \"\"\n            }\n    elif\
          \ isinstance(route_data, dict):\n        data = route_data\n    else:\n\
          \        return {\n            \"route_text\": f\"❌ 不支持的数据类型：{type(route_data).__name__}\"\
          ,\n            \"total_distance_km\": 0,\n            \"total_duration_min\"\
          : 0,\n            \"toll_fee\": 0,\n            \"parse_status\": \"fail\"\
          ,\n            \"route_url\": \"\"\n        }\n\n    # 校验接口返回状态\n    if\
          \ str(data.get('status', '0')) != '1':\n        error_info = data.get('info',\
          \ '未知错误')\n        return {\n            \"route_text\": f\"❌ {mode_name}路径规划失败：{error_info}\"\
          ,\n            \"total_distance_km\": 0,\n            \"total_duration_min\"\
          : 0,\n            \"toll_fee\": 0,\n            \"parse_status\": \"fail\"\
          ,\n            \"route_url\": \"\"\n        }\n\n    # 提取路径基础数据\n    route\
          \ = data.get('route', {})\n    paths = route.get('paths', [])\n    if not\
          \ paths:\n        return {\n            \"route_text\": f\"❌ 未规划出可行的{mode_name}路线\"\
          ,\n            \"total_distance_km\": 0,\n            \"total_duration_min\"\
          : 0,\n            \"toll_fee\": 0,\n            \"parse_status\": \"fail\"\
          ,\n            \"route_url\": \"\"\n        }\n\n    best_path = paths[0]\n\
          \    total_distance_m = int(best_path.get('distance', 0))\n    api_duration_s\
          \ = int(best_path.get('duration', 0))\n    tolls = int(best_path.get('tolls',\
          \ 0))\n    traffic_lights = int(best_path.get('traffic_lights', 0))\n\n\
          \    total_distance_km = round(total_distance_m / 1000, 1)\n\n    # 分模式计算耗时\n\
          \    if travel_mode == \"run\":\n        # 跑步按大众6分/公里配速估算\n        total_duration_min\
          \ = int(total_distance_km * 6)\n        walk_duration_min = api_duration_s\
          \ // 60\n    else:\n        total_duration_min = api_duration_s // 60\n\n\
          \    # 格式化耗时文本\n    hours = total_duration_min // 60\n    minutes = total_duration_min\
          \ % 60\n    duration_text = f\"{hours}小时{minutes}分钟\" if hours > 0 else\
          \ f\"{minutes}分钟\"\n\n    # 格式化路线步骤\n    steps = best_path.get('steps',\
          \ [])\n    steps_text = \"\"\n    for i, step in enumerate(steps[:8]):\n\
          \        instruction = step.get('instruction', '').strip()\n        step_dist_m\
          \ = int(step.get('distance', 0))\n        step_dist_km = round(step_dist_m\
          \ / 1000, 1)\n        if instruction:\n            steps_text += f\"\\n{i+1}.\
          \ {instruction}（约{step_dist_km}公里）\"\n\n    if len(steps) > 8:\n       \
          \ steps_text += f\"\\n...（剩余{len(steps)-8}段路线，全程请以实际路况为准）\"\n\n    # 生成对应模式的高德导航链接\n\
          \    route_url = \"\"\n    map_link_text = \"\"\n    if start_location and\
          \ dest_location:\n        route_url = f\"https://uri.amap.com/navigation?from={start_location}&to={dest_location}&mode={config['nav_mode']}&policy=1&src=sport_assistant&coordinate=gaode&callnative=0\"\
          \n        map_link_text = f\"\\n\U0001F5FA️ 查看完整地图导航：{route_url}\"\n\n \
          \   # 动态组装附加信息\n    extra_lines = \"\"\n    if config[\"show_toll\"] and\
          \ tolls > 0:\n        extra_lines += f\"\\n\U0001F4B0 高速费：{tolls} 元\"\n\
          \    if config[\"show_traffic_light\"]:\n        extra_lines += f\"\\n\U0001F6A6\
          \ 红绿灯：约{traffic_lights}个\"\n    \n    if travel_mode == \"run\":\n     \
          \   extra_lines += f\"\\n\U0001F6B6 步行参考耗时：{walk_duration_min} 分钟\"\n\n\
          \    # 组装最终文本\n    route_text = f\"\"\"{config['emoji']} {mode_name}前往【{dest_name}】路线规划\n\
          \U0001F4CD 起点：{start_address}\n\U0001F3C1 终点：{dest_name}\n\U0001F4CF 总距离：{total_distance_km}\
          \ 公里\n⏱️ 预计耗时：{duration_text}{extra_lines}\n\n\U0001F9ED 路线指引：{steps_text}\n\
          {map_link_text}\n\n\U0001F4A1 温馨提示：{config['tip_text']}\"\"\"\n\n    return\
          \ {\n        \"route_text\": route_text,\n        \"total_distance_km\"\
          : total_distance_km,\n        \"total_duration_min\": total_duration_min,\n\
          \        \"toll_fee\": tolls if travel_mode == \"car\" else 0,\n       \
          \ \"parse_status\": \"success\",\n        \"route_url\": route_url\n   \
          \ }"
        code_language: python3
